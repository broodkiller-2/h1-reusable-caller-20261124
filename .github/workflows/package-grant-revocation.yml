name: Owned package grant revocation probe

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read before owner revokes grant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          req = urllib.request.Request(
            'https://npm.pkg.github.com/@broodkiller-2%2fh1-owned-package-20261124',
            headers={'Accept':'application/vnd.npm.install-v1+json',
                     'Authorization':f'Bearer {os.environ["GH_TOKEN"]}',
                     'User-Agent':'owned-package-revocation-probe'})
          try:
            with urllib.request.urlopen(req, timeout=15) as response:
              present = '0.0.1' in json.load(response).get('versions', {})
              print(f'pre status={response.status} version_present={int(present)}')
              assert response.status == 200 and present
          except urllib.error.HTTPError as error:
            print(f'pre status={error.code} version_present=0')
            raise
          PY
      - name: Wait for owner grant removal
        run: sleep 90
      - name: Read after owner revokes grant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          req = urllib.request.Request(
            'https://npm.pkg.github.com/@broodkiller-2%2fh1-owned-package-20261124',
            headers={'Accept':'application/vnd.npm.install-v1+json',
                     'Authorization':f'Bearer {os.environ["GH_TOKEN"]}',
                     'User-Agent':'owned-package-revocation-probe'})
          try:
            with urllib.request.urlopen(req, timeout=15) as response:
              present = '0.0.1' in json.load(response).get('versions', {})
              print(f'post status={response.status} version_present={int(present)}')
          except urllib.error.HTTPError as error:
            print(f'post status={error.code} version_present=0')
          PY
