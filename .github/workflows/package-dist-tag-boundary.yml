name: Owned package dist tag permission boundary

on:
  workflow_dispatch:
    inputs:
      cleanup_tag:
        description: Existing synthetic tag to remove as owner
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Compare package tag access
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          CLEANUP_TAG: ${{ inputs.cleanup_tag }}
        shell: bash
        run: |
          package='@broodkiller-2/h1-owned-package-20261124'
          if [ -n "$CLEANUP_TAG" ]; then
            case "$CLEANUP_TAG" in h1-probe-[0-9]*) ;; *) echo 'dist_tag_cleanup invalid_input=1'; exit 1;; esac
            npm dist-tag rm "$package" "$CLEANUP_TAG" --registry=https://npm.pkg.github.com >/dev/null 2>npm-error.txt
            rc=$?
            echo "dist_tag_cleanup exit=$rc"
            rm -f npm-error.txt
            exit 0
          fi
          tag="h1-probe-${GITHUB_RUN_ID}"
          set +e
          npm dist-tag add "$package@0.0.1" "$tag" --registry=https://npm.pkg.github.com >/dev/null 2>npm-error.txt
          rc=$?
          set -e
          code=$(grep -oE 'E[A-Z0-9]{2,}' npm-error.txt | head -1 || true)
          rm -f npm-error.txt
          set +e
          tags=$(npm dist-tag ls "$package" --registry=https://npm.pkg.github.com 2>/dev/null)
          read_rc=$?
          set -e
          present=0
          if [ "$read_rc" -eq 0 ] && grep -q "^${tag}: 0.0.1$" <<< "$tags"; then present=1; fi
          echo "dist_tag_probe repository=${GITHUB_REPOSITORY} tag=$tag add_exit=$rc add_code=${code:-none} read_exit=$read_rc present=$present"
          if [ "$GITHUB_REPOSITORY" = 'broodkiller-2/h1-package-fixture-20261124' ] && [ "$present" -eq 1 ]; then
            npm dist-tag rm "$package" "$tag" --registry=https://npm.pkg.github.com >/dev/null 2>npm-error.txt
            cleanup_rc=$?
            echo "dist_tag_owner_cleanup exit=$cleanup_rc"
            rm -f npm-error.txt
          fi
