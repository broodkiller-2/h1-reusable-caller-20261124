name: Owned npm namespace authorization probe

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Compare two owned namespace publishes
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          printf "module.exports = 'owned namespace probe';\n" > index.js
          for scope in broodkiller-2 broodkiller-1; do
            cat > package.json <<JSON
          {
            "name": "@${scope}/h1-namespace-boundary-20261124",
            "version": "0.0.1",
            "description": "Owned account namespace authorization probe",
            "main": "index.js",
            "repository": { "type": "git", "url": "https://github.com/broodkiller-2/h1-reusable-caller-20261124" },
            "publishConfig": { "registry": "https://npm.pkg.github.com" }
          }
          JSON
            set +e
            npm publish --ignore-scripts --registry=https://npm.pkg.github.com > /dev/null 2> npm-error.txt
            result=$?
            set -e
            code=$(grep -oE 'E[A-Z0-9]{2,}' npm-error.txt | head -1 || true)
            echo "namespace=${scope} exit=${result} code=${code:-none}"
            rm -f npm-error.txt
          done
